apiVersion: apps/v1
kind: Deployment
metadata:
  name: obs-api
  namespace: rawtoh
spec:
  # Keep 1: the container runs DB migrations at startup
  # (bun run migrate.ts), which must not race across replicas.
  replicas: 1
  selector:
    matchLabels:
      app: obs-api
  template:
    metadata:
      labels:
        app: obs-api
    spec:
      containers:
        - name: api
          image: ghcr.io/rawtoh-io/module-obs-api:production
          # Mutable tag: rollouts always pull the latest build.
          imagePullPolicy: Always
          ports:
            - containerPort: 10700
          env:
            - name: PORT
              value: "10700"
          envFrom:
            - configMapRef:
                name: obs-config
            - secretRef:
                name: obs-secrets
          # /health only comes up after migrations — give it time.
          startupProbe:
            httpGet:
              path: /health
              port: 10700
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 10700
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 10700
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: obs-api
  namespace: rawtoh
spec:
  selector:
    app: obs-api
  ports:
    - port: 10700
      targetPort: 10700
